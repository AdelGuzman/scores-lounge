<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Scores Lounge — Social Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #a8a8a8;
      --line: rgba(255,255,255,.10);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(70,70,70,.16), transparent 30%),
        #050505;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 18px 18px 30px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 58px;
    }

    .holiday-inn-maadi {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
    }

    .hi-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: #1db954;
      color: white;
      border-radius: 6px;
      font-weight: 700;
      font-size: 22px;
      font-style: italic;
    }

    .hi-text {
      font-size: 16px;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding-top: 10px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin: 6px auto 14px;
    }

    .scores-logo {
      width: 178px;
      height: 178px;
      object-fit: cover;
      border-radius: 50%;
      background: #000;
      border: 2px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
    }

    h1 {
      margin: 4px 0 4px;
      font-size: 28px;
      letter-spacing: .5px;
    }

    .connect-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 0 22px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .phone-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .phone-link:hover {
      text-decoration: underline;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link-card {
      min-height: 60px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.025)
      );

      color: #fff;
      text-decoration: none;

      display: grid;
      grid-template-columns: 38px 1fr 25px;
      align-items: center;

      text-align: left;
      font-weight: 700;

      transition: transform .18s ease,
                  background .18s ease,
                  border-color .18s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.22);
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #1d1d1d;
      font-size: 16px;
      font-weight: 800;
    }

    .instagram .icon {
      background: #d6249f;
    }

    .facebook .icon {
      background: #1877f2;
    }

    .tripadvisor .icon {
      background: #34a853;
      font-size: 11px;
    }

    .arrow {
      color: #8e8e8e;
      font-size: 21px;
      text-align: right;
    }

    footer {
      text-align: center;
      color: #6f6f6f;
      font-size: 11px;
      margin-top: 22px;
      letter-spacing: .6px;
    }

    @media (max-width: 390px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .scores-logo {
        width: 155px;
        height: 155px;
      }

      h1 {
        font-size: 25px;
      }

      .connect-row {
        gap: 9px;
      }

      .phone-link,
      .subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- Holiday Inn -->
    <header class="topbar">
      <div class="holiday-inn">
        <div class="hi-mark">H</div>
        <div class="hi-text">Holiday Inn</div>
      </div>
    </header>


    <section class="hero">

      <!-- Scores Logo -->
      <div class="logo-wrap">
        <img
          src="scores-logo.jpg"
          alt="Scores Lounge Logo"
          class="scores-logo"
        />
      </div>


      <h1>Scores Lounge</h1>


      <!-- Connect + Phone -->
      <div class="connect-row">
        <p class="subtitle">Connect with us</p>

        <a
          class="phone-link"
          href="tel:01158122200"
        >
          01158122200
        </a>
      </div>


      <!-- Social Links -->
      <div class="links">

        <!-- Instagram -->
        <a
          class="link-card instagram"
          href="https://www.instagram.com/scores_lounge/"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">◎</span>
          <span>Instagram</span>
          <span class="arrow">→</span>
        </a>


        <!-- Facebook -->
        <a
          class="link-card facebook"
          href="https://www.facebook.com/Scoressportsbar"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">f</span>
          <span>Facebook</span>
          <span class="arrow">→</span>
        </a>


        <!-- Tripadvisor -->
        <a
          class="link-card tripadvisor"
          href="https://www.tripadvisor.com/Restaurant_Review-g294201-d14774406-Reviews-Scores_Sports_Bar_Restaurant-Cairo_Cairo_Governorate.html"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">TA</span>
          <span>Tripadvisor</span>
          <span class="arrow">→</span>
        </a>

      </div>

    </section>


    <footer>
      Scores Lounge · Food · Drinks · Sports
    </footer>

  </main>

</body>
</html>
