<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scores Lounge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND PHOTO GRID
       ========================= */

    .photo-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #050505;
    }

    .photo-track {
      width: 100%;
      animation: moveDown 40s linear infinite;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
    }

    .photo-grid img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 5px;
      display: block;

      filter:
        brightness(0.65)
        saturate(0.85);
    }

    /* حركة الصور لتحت */
    @keyframes moveDown {
      from {
        transform: translateY(-50%);
      }

      to {
        transform: translateY(0);
      }
    }

    /* طبقة سوداء فوق الصور */
    .dark-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.75),
          rgba(0,0,0,.50),
          rgba(0,0,0,.75)
        );
    }


    /* =========================
       MAIN WEBSITE
       ========================= */

    .page {
      position: relative;
      z-index: 2;

      width: min(100%, 560px);
      margin: auto;

      padding:
        18px
        18px
        30px;
    }


    /* =========================
       HOLIDAY INN MAADI
       ========================= */

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;

      min-height: 58px;
    }

    .holiday-inn {
      display: flex;
      align-items: center;

      gap: 9px;

      text-shadow:
        0 2px 12px black;
    }

    .hi-mark {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      background: #1db954;

      border-radius: 6px;

      font-size: 22px;
      font-weight: bold;
      font-style: italic;

      box-shadow:
        0 5px 18px rgba(0,0,0,.5);
    }

    .hi-text {
      font-size: 16px;
      font-weight: bold;
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      text-align: center;
      padding-top: 10px;
    }


    /* LOGO */

    .logo-wrap {
      display: flex;
      justify-content: center;

      margin:
        6px
        auto
        14px;
    }

    .scores-logo {
      width: 178px;
      height: 178px;

      object-fit: cover;

      border-radius: 50%;

      border:
        2px solid rgba(255,255,255,.18);

      box-shadow:
        0 18px 50px rgba(0,0,0,.7);
    }


    h1 {
      margin: 4px 0;

      font-size: 28px;
      letter-spacing: .5px;

      text-shadow:
        0 3px 18px black;
    }


    /* =========================
       CONNECT + PHONE
       ========================= */

    .connect-row {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 14px;

      margin-bottom: 22px;
    }

    .subtitle {
      margin: 0;

      color: #c2c2c2;

      font-size: 14px;

      text-shadow:
        0 2px 10px black;
    }

    .phone-link {
      color: white;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;

      text-shadow:
        0 2px 10px black;
    }

    .phone-link:hover {
      text-decoration: underline;
    }


    /* =========================
       BUTTONS
       ========================= */

    .links {
      display: grid;

      gap: 12px;
    }

    .link-card {
      min-height: 60px;

      padding:
        0
        16px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 16px;

      background:
        rgba(5,5,5,.72);

      backdrop-filter:
        blur(10px);

      color: white;

      text-decoration: none;

      display: grid;

      grid-template-columns:
        38px
        1fr
        25px;

      align-items: center;

      text-align: left;

      font-weight: bold;

      box-shadow:
        0 10px 30px rgba(0,0,0,.3);

      transition:
        .2s;
    }

    .link-card:hover {
      transform: translateY(-2px);

      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(255,255,255,.35);
    }


    /* ICON */

    .icon {
      width: 30px;
      height: 30px;

      border-radius: 9px;

      display: grid;
      place-items: center;

      background: #222;

      font-weight: bold;
    }

    .instagram .icon {
      background: #d6249f;
    }

    .facebook .icon {
      background: #1877f2;
    }

    .tripadvisor .icon {
      background: #34a853;

      font-size: 10px;
    }

    .arrow {
      color: #aaa;

      font-size: 21px;

      text-align: right;
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      text-align: center;

      color: #aaa;

      font-size: 11px;

      margin-top: 22px;

      text-shadow:
        0 2px 10px black;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 6px;

        padding: 6px;
      }

      .photo-grid img {
        height: 190px;
      }
    }


    @media (max-width: 390px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .scores-logo {
        width: 155px;
        height: 155px;
      }

      h1 {
        font-size: 25px;
      }

      .connect-row {
        gap: 9px;
      }

      .phone-link,
      .subtitle {
        font-size: 13px;
      }

      .photo-grid img {
        height: 165px;
      }
    }

  </style>
</head>
